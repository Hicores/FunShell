[package]
name = "funshell"
version = "0.1.0"
description = "Portable SSH server management workspace"
authors = ["FunShell Contributors"]
edition = "2024"
rust-version = "1.85"

[lib]
name = "funshell_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
tauri = { version = "2.11.5", features = [] }
tauri-plugin-dialog = "2.6.0"
tauri-plugin-opener = "2.5.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1.48", features = ["macros", "rt-multi-thread", "sync", "time", "net", "io-util", "process", "fs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
aes-gcm = "0.10"
argon2 = "0.5"
base64 = "0.22"
bytes = "1.10"
chrono = { version = "0.4", features = ["serde"] }
dashmap = "6.1"
futures-util = "0.3"
getrandom = "0.4"
parking_lot = "0.12"
rand = "0.8"
rand_chacha = "0.10"
rand_core = "0.10"
russh = { version = "0.62.2", default-features = false, features = ["async-trait", "flate2", "ring", "rsa"] }
russh-sftp = "2.3.0"
rusqlite = { version = "0.38", features = ["bundled"] }
sha2 = "0.10"
uuid = { version = "1.18", features = ["v4", "serde"] }
tokio-socks = "0.5"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security_Cryptography"] }
zeroize = "1.8"

[dev-dependencies]
tempfile = "3.23"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = "symbols"
